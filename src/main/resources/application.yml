spring:
  application:
    name: vidacruz-agent
  reactor:
    context-propagation: auto
  r2dbc:
    url: ${AGENT_R2DBC_URL:r2dbc:postgresql://localhost:5433/vidacruz_agent}
    username: ${AGENT_DB_USERNAME:vidacruz_agent}
    password: ${AGENT_DB_PASSWORD:change-me-for-local-development}
  sql:
    init:
      mode: always
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:dummy-key-for-local-startup}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

app:
  security:
    api-key: ${AGENT_API_KEY}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topic: ${KAFKA_TRIAGE_TOPIC:triaje.eventos}
    consumer:
      enabled: ${KAFKA_CONSUMER_ENABLED:true}
      group-id: ${KAFKA_TRIAGE_CONSUMER_GROUP:vidacruz-agent-urgencias}
  assistant:
    language: ${ASSISTANT_LANGUAGE:es}
    protocols:
      directory: ${PROTOCOLS_DIRECTORY:./protocols}
      chunk-max-characters: ${PROTOCOL_CHUNK_MAX_CHARACTERS:3000}
    embeddings:
      base-url: ${VOYAGE_BASE_URL:https://api.voyageai.com/v1}
      api-key: ${VOYAGE_API_KEY:}
      model: ${VOYAGE_MODEL:voyage-4}
    retrieval:
      candidate-limit: ${RAG_CANDIDATE_LIMIT:20}
      result-limit: ${RAG_RESULT_LIMIT:3}
      rrf-k: ${RAG_RRF_K:60}
      max-cosine-distance: ${RAG_MAX_COSINE_DISTANCE:0.55}
      minimum-rrf-score: ${RAG_MINIMUM_RRF_SCORE:0.015}
    ingestion:
      enabled: ${PROTOCOL_INGESTION_ENABLED:true}
    llm:
      provider: ${ASSISTANT_LLM_PROVIDER:google-ai-studio}
      circuit-breaker:
        failure-window-size: ${LLM_CIRCUIT_BREAKER_FAILURE_WINDOW_SIZE:5}
        failure-rate-threshold: ${LLM_CIRCUIT_BREAKER_FAILURE_RATE_THRESHOLD:100}
        open-state-wait-duration: ${LLM_CIRCUIT_BREAKER_OPEN_STATE_WAIT_DURATION:30s}
        permitted-calls-in-half-open-state: ${LLM_CIRCUIT_BREAKER_HALF_OPEN_CALLS:1}
      providers:
        google-ai-studio:
          base-url: ${GOOGLE_AI_STUDIO_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
          completions-path: ${GOOGLE_AI_STUDIO_COMPLETIONS_PATH:/v1/chat/completions}
          model: ${GOOGLE_AI_STUDIO_MODEL:gemini-3.1-flash-lite}
          api-key: ${GOOGLE_AI_STUDIO_API_KEY:}
        groqcloud:
          base-url: ${GROQCLOUD_BASE_URL:https://api.groq.com/openai}
          completions-path: ${GROQCLOUD_COMPLETIONS_PATH:/v1/chat/completions}
          model: ${GROQCLOUD_MODEL:llama-3.1-70b-versatile}
          api-key: ${GROQCLOUD_API_KEY:}
        mistral:
          base-url: ${MISTRAL_BASE_URL:https://api.mistral.ai}
          completions-path: ${MISTRAL_COMPLETIONS_PATH:/v1/chat/completions}
          model: ${MISTRAL_MODEL:mistral-large-latest}
          api-key: ${MISTRAL_API_KEY:}
        openai:
          base-url: ${OPENAI_BASE_URL:https://api.openai.com}
          completions-path: ${OPENAI_COMPLETIONS_PATH:/v1/chat/completions}
          model: ${OPENAI_MODEL:gpt-4o-mini}
          api-key: ${OPENAI_API_KEY:}

