name: vidacruz-agent

services:
  agent-postgres:
    image: paradedb/paradedb:0.26.5
    environment:
      POSTGRES_DB: ${AGENT_POSTGRES_DB:-vidacruz_agent}
      POSTGRES_USER: ${AGENT_DB_USERNAME:-vidacruz_agent}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD in vidacruz-agent/.env}
    ports:
      - "${AGENT_POSTGRES_PORT:-5434}:5432"
    volumes:
      - agent-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "${KAFKA_PORT:-9092}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  kafka-topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command:
      - --bootstrap-server
      - kafka:9092
      - --create
      - --if-not-exists
      - --topic
      - triaje.eventos
      - --partitions
      - "1"
      - --replication-factor
      - "1"
    restart: "no"

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENT_R2DBC_URL: r2dbc:postgresql://agent-postgres:5432/${AGENT_POSTGRES_DB:-vidacruz_agent}
      AGENT_DB_USERNAME: ${AGENT_DB_USERNAME:-vidacruz_agent}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD in vidacruz-agent/.env}
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY in vidacruz-agent/.env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TRIAGE_TOPIC: triaje.eventos
      KAFKA_TRIAGE_CONSUMER_GROUP: vidacruz-agent-urgencias
      KAFKA_CONSUMER_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ASSISTANT_LLM_PROVIDER: ${ASSISTANT_LLM_PROVIDER:-stub}
      GOOGLE_AI_STUDIO_API_KEY: ${GOOGLE_AI_STUDIO_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_MODEL: ${VOYAGE_MODEL:-voyage-4}
      RAG_MINIMUM_RRF_SCORE: ${RAG_MINIMUM_RRF_SCORE:-0.015}
      PROTOCOLS_DIRECTORY: /app/protocols
    ports:
      - "${ASSISTANT_HTTP_PORT:-8082}:8080"
    volumes:
      - ./protocols:/app/protocols:ro
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 30s

volumes:
  agent-postgres-data:
  kafka-data:
  redis-data:
